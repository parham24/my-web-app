name: Build APK from Web Files

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert web files to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "./"        # مسیر پوشه حاوی index.html شما (همون پوشه اصلی)
          app-name: "SaftehBank"         # نام دلخواه برای اپلیکیشن شما (به انگلیسی)
          output-folder-path: "my-apks"   # نام پوشه‌ای که APKها در آن ذخیره می‌شوند

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaftehBank-App
          path: my-apks/                 # مسیری که خروجی APK در آن قرار می‌گیرد
